services:
  # =============================================================================
  # Neo4j Graph Database
  # =============================================================================
  neo4j:
    image: neo4j:5
    container_name: code-kag-neo4j
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - code-kag-network
    restart: unless-stopped

  # =============================================================================
  # Code-KAG MCP Server
  # =============================================================================
  code-kag:
    build: .
    container_name: code-kag-server
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      # Mount your code repositories here
      - ${CODE_PATH:-./repos}:/repos:ro
      # Mount for stdio communication with MCP
      - /tmp/code-kag:/tmp/code-kag
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - code-kag-network
    restart: unless-stopped
    # Keep container running for MCP stdio communication
    stdin_open: true
    tty: true

  # =============================================================================
  # Indexer Service (run once to index repos)
  # =============================================================================
  indexer:
    build: .
    container_name: code-kag-indexer
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - ${CODE_PATH:-./repos}:/repos:ro
    networks:
      - code-kag-network
    profiles:
      - indexer  # Only runs when explicitly called
    entrypoint: ["python", "cli.py"]
    command: ["index", "/repos", "--id", "${REPO_ID:-my-project}"]

networks:
  code-kag-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

# =============================================================================
# USAGE:
# =============================================================================
#
# 1. Start the database:
#    docker-compose up -d neo4j
#
# 2. Wait for Neo4j to be healthy:
#    docker-compose ps
#
# 3. Index a repository:
#    CODE_PATH=/path/to/your/code REPO_ID=my-project docker-compose run --rm indexer
#
# 4. Start the MCP server:
#    docker-compose up -d code-kag
#
# 5. View Neo4j browser:
#    http://localhost:7474 (credentials from .env)
#
# 6. Or do everything at once:
#    CODE_PATH=/path/to/code docker-compose up -d
#
# =============================================================================
